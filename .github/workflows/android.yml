name: Android CI/CD
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Android CI PR #{0}', github.event.pull_request.number) || format('Android CI {0}', github.ref_name) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a new commit on a PR branch or on main cancels the run in
# progress there, so rapid merges to main end in one run for the newest commit
# (it contains all earlier ones).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Job -1: PR template gate — runs alongside Detect Changes; a failure skips
  # every expensive job (lint/tests/build) but not the cheap ones.
  # Uses the base branch's copy of the script so a PR cannot weaken its own check.
  # The explanatory bot comment is posted by pr-template.yml.
  # Re-running this job re-reads the current PR body (see the step below).
  # ─────────────────────────────────────────────────────────────────────
  pr-template:
    name: PR Template
    # Repo owner's PRs skip the template gate (skipped counts as pass downstream).
    if: github.event_name == 'pull_request' && !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted script (base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Validate the LIVE description, not $GITHUB_EVENT_PATH: a re-run replays the
      # original event payload, so a fixed description could never turn this green.
      - name: Validate PR description
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" \
            | jq --arg repo "$GH_REPO" '{pull_request: ., repository: {full_name: $repo}}' > "$RUNNER_TEMP/event.json"
          python3 .github/scripts/check_pr_template.py "$RUNNER_TEMP/event.json"

  # ─────────────────────────────────────────────────────────────────────
  # Job 0: Detect changes — skips heavy Android build/tests for doc-only PRs
  # ─────────────────────────────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Paths Filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'app/**'
              - 'gradle/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - '.github/workflows/android.yml'
              - '.editorconfig'
              - 'flake.nix'
              - 'flake.lock'

  # ─────────────────────────────────────────────────────────────────────
  # Job 1: ktlint (code style) + resource guards — fastest feedback, runs in parallel.
  # ─────────────────────────────────────────────────────────────────────
  ktlint:
    name: ktlint — Code Style
    needs: [pr-template, changes]
    if: ${{ !cancelled() && needs.pr-template.result != 'failure' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # ktlint 1.8.0 is resolved by Gradle from Maven Central (no binary download).
      # checkColorLiterals: hardcoded Color guard (issue #622).
      # checkGermanStrings: every translatable string also exists in values-de/.
      - name: Run ktlintCheck + checkColorLiterals + checkGermanStrings
        run: ./gradlew ktlintCheck checkColorLiterals checkGermanStrings --continue

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ktlint-reports
          path: |
            app/build/reports/ktlint/
            build/reports/ktlint/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 2: Android Lint (static analysis) — runs in parallel with ktlint.
  # Depends on compileDebugKotlin, so it also catches unresolved refs.
  # ─────────────────────────────────────────────────────────────────────
  android-lint:
    name: Android Lint — Static Analysis
    needs: [pr-template, changes]
    if: ${{ !cancelled() && needs.pr-template.result != 'failure' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Run lintDebug
        run: ./gradlew lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 3: Unit tests — runs in parallel with ktlint & android-lint.
  # ─────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit & Integration Tests
    needs: [pr-template, changes]
    if: ${{ !cancelled() && needs.pr-template.result != 'failure' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # The runner has 4 vCPUs / 16 GB; the local default stays at 2 forks.
      # The Kover tasks attach the coverage agent (local runs without them stay
      # uninstrumented) and write the debug-variant report; there is no threshold.
      - name: Run test + coverage report
        run: ./gradlew test koverXmlReportDebug koverHtmlReportDebug -PtestForks=4

      # Telemetry only, never a gate.
      - name: Line coverage
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          path = "app/build/reports/kover/reportDebug.xml"
          if os.path.exists(path):
              root = ET.parse(path).getroot()
              line = next((c for c in root.findall("counter") if c.get("type") == "LINE"), None)
              if line is not None:
                  covered, missed = int(line.get("covered")), int(line.get("missed"))
                  total = covered + missed
                  percent = 100 * covered / total if total else 0
                  print(f"### Line coverage (debug unit tests)\n\n{percent:.1f} % ({covered} of {total} lines)\n")
          EOF

      # Telemetry only, never a gate: surfaces the slowest classes so perf work
      # targets real offenders.
      - name: Slowest unit-test classes
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows = []
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              rows.append((float(root.get("time", 0)), int(root.get("tests", 0)), root.get("name", path)))
          rows.sort(reverse=True)
          print("### Slowest unit-test classes\n")
          print(f"{len(rows)} classes, {sum(r[0] for r in rows):.0f}s summed across forks\n")
          print("| Time | Tests | Class |\n|---:|---:|---|")
          for secs, count, name in rows[:20]:
              print(f"| {secs:.1f}s | {count} | `{name.rsplit('.', 1)[-1]}` |")
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlDebug/
            app/build/reports/kover/reportDebug.xml
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 4: Build Debug APK — runs in parallel; CI Summary gates the result.
  # Also compiles the androidTest sources, so a broken instrumented test fails
  # here in minutes instead of inside the emulator job.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Debug APK
    needs: [pr-template, changes]
    if: ${{ !cancelled() && needs.pr-template.result != 'failure' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Build assembleDebug + compile androidTest sources
        run: ./gradlew assembleDebug compileDebugAndroidTestKotlin

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apollo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 5: Release Build — runs the real release pipeline (R8, resource
  # shrinking, lintVital, Compose group mapping) for the Play build type,
  # which shares every source set with release. Unsigned without the signing
  # secrets; nothing is uploaded. assemblePlay depends on checkPlayPermissions
  # (merged manifest has no REQUEST_INSTALL_PACKAGES, issue #7).
  # Catches debugImplementation-scoped dependencies that main code uses and
  # R8/lintVital breakage before a tag is pushed.
  # ─────────────────────────────────────────────────────────────────────
  release-compile:
    name: Release Build Check
    needs: [pr-template, changes]
    if: ${{ !cancelled() && needs.pr-template.result != 'failure' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      - name: Build minified Play APK (R8, lintVital, Play manifest check)
        run: ./gradlew assemblePlay

  # ─────────────────────────────────────────────────────────────────────
  # Job 6: Instrumented tests — runs on Android emulator.
  # Required for Compose UI tests (TEST-09, TEST-14) and Navigation3 tests
  # that need a real Activity lifecycle. Cannot run on JVM.
  # ─────────────────────────────────────────────────────────────────────
  instrumented-tests:
    name: Instrumented Tests
    needs: [pr-template, changes]
    if: ${{ !cancelled() && needs.pr-template.result != 'failure' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true

      # Enable KVM hardware acceleration on the Linux runner
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cache the AVD to avoid downloading/recreating it from scratch every time
      - name: AVD Cache
        id: avd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-atd-x86_64

      - name: Run connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -memory 2048
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: androidTest-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────
  # Job 7: CI Summary — pure aggregator over all jobs; the one check to watch
  # (and the one the release workflow requires on the tagged commit).
  # ─────────────────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    needs: [pr-template, changes, ktlint, android-lint, unit-tests, build, release-compile, instrumented-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check job results
        env:
          TEMPLATE_RESULT: ${{ needs.pr-template.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          KTLINT_RESULT: ${{ needs.ktlint.result }}
          LINT_RESULT: ${{ needs.android-lint.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_COMPILE_RESULT: ${{ needs.release-compile.result }}
          INSTRUMENTED_RESULT: ${{ needs.instrumented-tests.result }}
        run: |
          FAILED_JOBS=""
          for entry in "pr-template:$TEMPLATE_RESULT" "changes:$CHANGES_RESULT" "ktlint:$KTLINT_RESULT" "android-lint:$LINT_RESULT" "unit-tests:$TEST_RESULT" "build:$BUILD_RESULT" "release-compile:$RELEASE_COMPILE_RESULT" "instrumented-tests:$INSTRUMENTED_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "::notice::$name = $result"
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              FAILED_JOBS+="$name "
            fi
          done
          if [[ -n "$FAILED_JOBS" ]]; then
            echo "::error::CI failed (${FAILED_JOBS% }) — check individual job logs"
            exit 1
          fi
          echo "All CI jobs passed"
