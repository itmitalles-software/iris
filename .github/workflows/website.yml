name: Website

# Publishes website/ (static, no build step) to GitHub Pages at apollo.wutz.io.
# Manual only until the owner decides to take the site live (2026-10-14); then
# enable Pages (build type "workflow"), add the apollo CNAME in Cloudflare and
# add a push trigger for website/** on main.

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER == 'home' && fromJSON('["self-hosted","home"]') || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that every referenced asset exists
        run: |
          missing=0
          for ref in $(grep -oE '(src|href)="assets/[^"]+"' website/index.html | sed -E 's/^(src|href)="//; s/"$//' | sort -u); do
            [ -f "website/$ref" ] || { echo "::error::missing website/$ref"; missing=1; }
          done
          exit $missing
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    needs: build
    runs-on: ${{ vars.CI_RUNNER == 'home' && fromJSON('["self-hosted","home"]') || 'ubuntu-24.04' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
