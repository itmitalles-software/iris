name: "CodeQL Analysis"

# Weekly (and on demand) only: the Kotlin/Gradle build behind CodeQL is expensive
# and no ruleset or required check depends on it. Android CI covers push and PR.
on:
  schedule:
    - cron: '30 3 * * 1' # Runs at 03:30 UTC every Monday
  workflow_dispatch:

# Rapid merges to main end in one analysis of the newest commit.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ${{ vars.CI_RUNNER == 'home' && fromJSON('["self-hosted","home"]') || 'ubuntu-24.04' }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        validate-wrappers: true
        cache-provider: basic # keep 100% MIT — avoid proprietary gradle-actions-caching

    - name: Initialize CodeQL
      uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        languages: ${{ matrix.language }}
        build-mode: manual

    - name: Build Codebase (Compile Only)
      run: |
        ./gradlew compileDebugSources --no-daemon --no-build-cache

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
      with:
        category: "/language:${{matrix.language}}"
