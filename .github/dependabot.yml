version: 2

# Dependabot only queries Maven Central by default, so AndroidX and AGP (Google
# Maven) were never updated. These public registries need no credentials.
registries:
  google-maven:
    type: maven-repository
    url: "https://dl.google.com/dl/android/maven2/"
  maven-central:
    type: maven-repository
    url: "https://repo.maven.apache.org/maven2/"
  gradle-plugin-portal:
    type: maven-repository
    url: "https://plugins.gradle.org/m2/"

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    target-branch: "main"
    registries:
      - google-maven
      - maven-central
      - gradle-plugin-portal
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      androidx-core:
        patterns:
          - "androidx.compose*"
          - "androidx.core:*"
          - "androidx.lifecycle:*"
          - "androidx.activity:*"
          - "androidx.browser:*"
          - "androidx.navigation3:*"
          - "androidx.datastore:*"
          - "androidx.test*"
      networking:
        patterns:
          - "com.squareup.okhttp3:*"
          - "com.squareup.retrofit2:*"
          - "org.jetbrains.kotlinx:kotlinx-serialization*"
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
      testing:
        patterns:
          - "junit:*"
          - "org.junit*:*"
          - "io.mockk:*"
          - "app.cash.turbine:*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      actions:
        patterns:
          - "actions/*"
          - "gradle/actions"
