name: Bug report
description: Report a bug or unexpected behaviour
title: '[bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Security problems:** do not report them here; use [private vulnerability reporting](https://github.com/wutz-io/apollo-hermes-android/security/advisories/new) (see SECURITY.md).

        **Before you paste logs or screenshots, remove** host names (including tailnet names such as `<machine>.<tailnet>.ts.net`), IP addresses, tokens, cookies, passwords and certificates. This issue is public.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: To reproduce
      description: Steps to trigger it.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Apollo version
      description: Settings → About → Version (and Commit for debug builds).
      placeholder: '0.1.6'
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - GitHub release APK
        - Google Play
        - Debug build (Apollo Dev)
        - Built from source (release)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: 'Pixel 8, Android 16'
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Tailscale Serve (HTTPS)
        - Other HTTPS reverse proxy or tunnel (e.g. Cloudflare Access)
        - Plain HTTP on a local network
        - Loopback / emulator (adb reverse)
        - Other
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: Login
      multiple: true
      options:
        - Username and password
        - Browser sign-in (OAuth)
        - Token
        - mTLS client certificate
        - Custom headers
    validations:
      required: false
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Agent version
      description: In Apollo under System → Hermes, or `hermes --version` on the server.
      placeholder: 'v0.21.6'
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: |
        Logs, screenshots, or anything else relevant (redacted, see above). For image problems, the filtered debug log from [docs/image-attachment-diagnostics.md](https://github.com/wutz-io/apollo-hermes-android/blob/main/docs/image-attachment-diagnostics.md) helps.
